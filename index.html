<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#F7F4EE">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="出貨通知">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>波波酪梨 · 出貨通知</title>
<style>
:root{
  --paper:#FFFFFF; --cream:#F7F4EE; --ink:#3E3226; --muted:#8A7C6C;
  --line:#E4DED2; --wash:#F4F1E9;
  --leaf:#6F9A46; --leaf-dark:#5A7F38; --bark:#6B563C;
  --alert:#B3261E; --alert-bg:#FBEDEA; --done:#B0A695;
  --tap:60px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden}
body{
  font-family:-apple-system,"Noto Sans TC","PingFang TC",sans-serif;
  color:var(--ink); background:var(--cream);
  font-size:17px; line-height:1.45; overscroll-behavior:none;
}
button,input{font:inherit;color:inherit}
button{border:0;background:none;cursor:pointer}
.num{font-variant-numeric:tabular-nums}
.hide{display:none !important}

/* 骨架：高度用 dvh；safe-area 只由 nav 吸收，body 不再重複 padding */
#app{display:flex;flex-direction:column;height:100vh;height:100dvh}
.screen{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 16px 20px}
.topbar{
  position:sticky;top:0;z-index:20;background:var(--cream);
  padding:calc(env(safe-area-inset-top) + 8px) 16px 9px;
  margin:0 -16px 12px;border-bottom:1px solid var(--line);
  display:flex;align-items:baseline;gap:10px;
}
.topbar h1{font-size:18px;font-weight:800;margin:0;letter-spacing:.04em}
.stamp{font-size:12.5px;color:var(--muted);margin-left:auto;text-align:right}
.stamp.stale{color:var(--alert);font-weight:700}

nav#tabs{
  flex:none;display:flex;border-top:1px solid var(--line);background:var(--paper);
  padding-bottom:env(safe-area-inset-bottom);
}
nav#tabs button{
  flex:1;padding:7px 0 5px;font-size:11px;color:var(--muted);
  display:flex;flex-direction:column;align-items:center;gap:2px;position:relative;
}
nav#tabs svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;
  stroke-linecap:round;stroke-linejoin:round}
nav#tabs button[aria-current="true"]{color:var(--leaf);font-weight:700}
.badge{
  position:absolute;top:3px;left:50%;margin-left:6px;
  background:var(--alert);color:#fff;font-size:10px;font-weight:700;
  min-width:16px;height:16px;border-radius:8px;padding:0 4px;
  display:flex;align-items:center;justify-content:center;
}

.bar{display:flex;gap:8px;align-items:center;margin-bottom:12px}
.btn{
  min-height:var(--tap);padding:0 18px;border-radius:14px;
  background:var(--leaf);color:#fff;font-weight:700;font-size:16.5px;
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
}
.btn:active{background:var(--leaf-dark)}
.btn.ghost{background:var(--paper);color:var(--ink);border:1px solid var(--line)}
.btn.ghost:active{background:var(--wash)}
.btn.wide{width:100%}
.btn.sm{min-height:44px;font-size:15px;padding:0 14px;border-radius:11px}
.btn.xs{min-height:38px;font-size:13.5px;padding:0 12px;border-radius:10px;white-space:nowrap}
.btn[disabled]{opacity:.45}
.field{width:100%;min-height:50px;padding:11px 14px;border:1px solid var(--line);
  border-radius:12px;background:var(--paper);margin-bottom:10px}
.field:focus{outline:2px solid var(--leaf);outline-offset:-1px}
.fieldWrap{position:relative}
.fieldWrap .field{padding-right:66px}
.eye{position:absolute;right:6px;top:50%;transform:translateY(-50%);
  min-height:38px;padding:0 12px;border-radius:9px;font-size:14px;
  color:var(--leaf);font-weight:700}
.eye:active{background:var(--wash)}

.notice{border-radius:12px;padding:11px 13px;margin-bottom:12px;font-size:14.5px;
  background:var(--alert-bg);border:1px solid #EDCFC9;color:#8A2119;font-weight:600}
.notice.calm{background:var(--wash);border-color:var(--line);color:var(--muted);font-weight:400;white-space:pre-line}
.empty{text-align:center;color:var(--muted);padding:48px 20px;font-size:15px}
.tally{font-size:13.5px;color:var(--muted);margin:0 2px 10px;display:flex;gap:16px}
.tally b{color:var(--ink);font-weight:800}
.secTitle{font-size:12px;font-weight:800;color:var(--muted);letter-spacing:.12em;margin:20px 2px 8px}

.card{display:block;width:100%;text-align:left;background:var(--paper);
  border:1px solid var(--line);border-left:5px solid var(--line);
  border-radius:14px;padding:12px 14px;margin-bottom:9px}
.card:active{background:var(--wash)}
.card.part{border-left-color:#D9A441}
.card.full{border-left-color:var(--leaf);background:var(--wash)}
.card.full .nm{color:var(--done)}
.card.extra{border-left-color:var(--bark)}
.cardHead{display:flex;align-items:baseline;gap:8px}
.nm{font-size:20px;font-weight:800;letter-spacing:.04em}
.tagExtra{font-size:10.5px;font-weight:700;color:#fff;background:var(--bark);
  border-radius:5px;padding:2px 6px;letter-spacing:.04em}
.meta{margin-left:auto;font-size:13.5px;color:var(--muted);white-space:nowrap}
.dots{display:flex;align-items:center;gap:6px;margin-top:6px;font-size:12.5px;color:var(--muted)}
.dot{width:11px;height:11px;border-radius:50%;border:2px solid var(--line);flex:none}
.dot.on{background:var(--leaf);border-color:var(--leaf)}
.items{margin-top:5px;font-size:12.5px;color:var(--muted);line-height:1.5;
  white-space:pre-line;word-break:break-all}
.items.warn{color:var(--alert);font-weight:700}

.sheet{position:fixed;inset:0;z-index:60;background:rgba(62,50,38,.5);display:flex;align-items:flex-end}
.sheetBody{background:var(--cream);width:100%;border-radius:20px 20px 0 0;
  padding:18px 16px calc(16px + env(safe-area-inset-bottom));max-height:82%;overflow-y:auto}
.sheetBody h2{margin:0 0 3px;font-size:19px}
.sheetBody p{margin:0 0 14px;color:var(--muted);font-size:14px}
.boxBtn{display:block;width:100%;text-align:left;border:1px solid var(--line);
  border-radius:13px;padding:13px;margin-bottom:8px;background:var(--paper)}
.boxBtn.shot{background:var(--wash);color:var(--done)}
.boxBtn b{font-size:17px}
.boxBtn span{display:block;font-size:12.5px;color:var(--muted);margin-top:3px}

.reviewHead{display:flex;align-items:baseline;gap:10px;margin-bottom:10px}
.reviewHead .meta{margin-left:auto}
.reviewImg{width:100%;max-height:46vh;object-fit:contain;border-radius:12px;
  background:var(--wash);display:block;margin-bottom:12px}

.row{display:flex;gap:11px;align-items:center;background:var(--paper);
  border:1px solid var(--line);border-radius:14px;padding:9px;margin-bottom:9px}
.row.sent{background:var(--wash);border-color:var(--wash)}
.row.sent .nm{color:var(--done)}
.row img{width:56px;height:56px;object-fit:cover;border-radius:10px;flex:none;background:var(--wash)}
.rowMain{flex:1;min-width:0}
.rowMeta{font-size:12.5px;color:var(--muted);margin-top:2px}
.rowMeta.warn{color:var(--alert);font-weight:700}
.rowActs{display:flex;flex-direction:column;gap:5px;flex:none}

#toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);
  background:var(--ink);color:#fff;padding:11px 17px;border-radius:11px;
  font-size:15px;font-weight:600;z-index:90;opacity:0;transition:opacity .18s;
  pointer-events:none;max-width:88%;text-align:center;white-space:pre-line;line-height:1.4}
#toast.on{opacity:.96}
@media (prefers-reduced-motion:reduce){*{transition:none !important}}
</style>
</head>
<body>
<div id="app">

  <section id="s-shoot" class="screen">
    <div class="topbar">
      <h1>出貨拍照</h1>
      <div class="stamp" id="stamp">尚未取得資料</div>
    </div>
    <div id="shootBody"></div>
  </section>

  <section id="s-notify" class="screen hide">
    <div class="topbar">
      <h1>發送通知</h1>
      <div class="stamp" id="stamp2"></div>
    </div>
    <div id="notifyBody"></div>
  </section>

  <section id="s-setup" class="screen hide">
    <div class="topbar"><h1>設定</h1></div>
    <div id="setupBody"></div>
  </section>

  <nav id="tabs">
    <button data-go="s-shoot" aria-current="true">
      <svg viewBox="0 0 24 24"><path d="M4 8h3l1.5-2h7L17 8h3a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z"/><circle cx="12" cy="13" r="3.4"/></svg>
      出貨
    </button>
    <button data-go="s-notify">
      <svg viewBox="0 0 24 24"><path d="M20 12a7.5 7.5 0 0 1-10.9 6.7L4 20l1.4-4.3A7.5 7.5 0 1 1 20 12z"/></svg>
      通知
      <span class="badge hide" id="badgeNotify">0</span>
    </button>
    <button data-go="s-setup">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 3v2m0 14v2M3 12h2m14 0h2M5.6 5.6l1.4 1.4m10 10 1.4 1.4m0-12.8-1.4 1.4m-10 10-1.4 1.4"/></svg>
      設定
    </button>
  </nav>
</div>

<div id="toast"></div>
<script src="app.js"></script>
</body>
</html>
