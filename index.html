<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#14231A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="出貨通知">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>波波酪梨 · 出貨通知</title>
<style>
:root{
  --paper:#FFFFFF; --ink:#14231A; --muted:#6B7A70; --line:#DDE4DE;
  --go:#2E6B3E; --go-dark:#20502D; --alert:#B3261E; --alert-bg:#FDECEA;
  --done:#9AA79E; --wash:#F4F7F4; --seed:#8A5A2B;
  --tap:64px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{
  font-family:-apple-system,"Noto Sans TC","PingFang TC",sans-serif;
  color:var(--ink); background:var(--paper);
  font-size:17px; line-height:1.45;
  padding-bottom:env(safe-area-inset-bottom);
  overscroll-behavior-y:none;
}
button,input,select{font:inherit;color:inherit}
button{border:0;background:none;cursor:pointer}
.num{font-variant-numeric:tabular-nums}
.hide{display:none !important}

/* ── 版面骨架 ───────────────────── */
#app{display:flex;flex-direction:column;height:100%}
.screen{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 16px 24px}
.topbar{
  position:sticky;top:0;z-index:20;background:var(--paper);
  padding:calc(env(safe-area-inset-top) + 10px) 16px 10px;
  margin:0 -16px 12px;border-bottom:1px solid var(--line);
  display:flex;align-items:baseline;gap:10px;
}
.topbar h1{font-size:19px;font-weight:700;margin:0;letter-spacing:.02em}
.stamp{font-size:13px;color:var(--muted);margin-left:auto;text-align:right;line-height:1.3}
.stamp.stale{color:var(--alert);font-weight:600}

nav#tabs{
  display:flex;border-top:1px solid var(--line);background:var(--paper);
  padding-bottom:env(safe-area-inset-bottom);
}
nav#tabs button{
  flex:1;padding:11px 0 9px;font-size:12px;color:var(--muted);
  display:flex;flex-direction:column;align-items:center;gap:3px;
}
nav#tabs button .g{font-size:21px;line-height:1}
nav#tabs button[aria-current="true"]{color:var(--go);font-weight:700}
nav#tabs .badge{
  position:absolute;transform:translate(15px,-4px);
  background:var(--alert);color:#fff;font-size:10px;font-weight:700;
  min-width:17px;height:17px;border-radius:9px;padding:0 4px;
  display:flex;align-items:center;justify-content:center;
}

/* ── 元件 ───────────────────────── */
.bar{display:flex;gap:8px;align-items:center;margin-bottom:12px}
.btn{
  min-height:var(--tap);padding:0 18px;border-radius:12px;
  background:var(--go);color:#fff;font-weight:700;font-size:17px;
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
}
.btn:active{background:var(--go-dark)}
.btn.ghost{background:var(--wash);color:var(--ink);border:1px solid var(--line)}
.btn.wide{width:100%}
.btn.sm{min-height:46px;font-size:15px;padding:0 14px;border-radius:10px}
.btn[disabled]{opacity:.45}
.field{width:100%;min-height:52px;padding:12px 14px;border:1px solid var(--line);
  border-radius:12px;background:var(--wash);margin-bottom:12px}
.field:focus{outline:2px solid var(--go);outline-offset:-1px;background:var(--paper)}

.notice{
  border-radius:12px;padding:12px 14px;margin-bottom:14px;font-size:15px;
  background:var(--alert-bg);border:1px solid #F2C4BF;color:#7E1D17;font-weight:600;
}
.notice.calm{background:var(--wash);border-color:var(--line);color:var(--muted);font-weight:400}
.empty{text-align:center;color:var(--muted);padding:56px 20px;font-size:15px}
.tally{font-size:14px;color:var(--muted);margin:0 2px 10px;display:flex;gap:14px}
.tally b{color:var(--ink);font-weight:700}
.secTitle{font-size:13px;font-weight:700;color:var(--muted);letter-spacing:.08em;
  margin:22px 2px 8px}

/* ── 訂單卡 ─────────────────────── */
.card{
  display:block;width:100%;text-align:left;background:var(--paper);
  border:1px solid var(--line);border-left:5px solid var(--line);
  border-radius:12px;padding:13px 14px;margin-bottom:10px;
}
.card:active{background:var(--wash)}
.card.part{border-left-color:#E2B23C}
.card.full{border-left-color:var(--go);background:var(--wash)}
.card.full .nm{color:var(--done)}
.card.extra{border-left-color:var(--seed)}
.cardHead{display:flex;align-items:baseline;gap:10px}
.nm{font-size:21px;font-weight:700;letter-spacing:.03em}
.tagExtra{font-size:11px;font-weight:700;color:#fff;background:var(--seed);
  border-radius:5px;padding:2px 6px;letter-spacing:.04em}
.meta{margin-left:auto;font-size:14px;color:var(--muted);white-space:nowrap}
.dots{display:flex;align-items:center;gap:6px;margin-top:7px;font-size:13px;color:var(--muted)}
.dot{width:12px;height:12px;border-radius:50%;border:2px solid var(--line);flex:none}
.dot.on{background:var(--go);border-color:var(--go)}
.items{margin-top:6px;font-size:13px;color:var(--muted);line-height:1.5;
  white-space:pre-line;word-break:break-all}

/* ── 選箱 / 對話層 ───────────────── */
.sheet{position:fixed;inset:0;z-index:60;background:rgba(20,35,26,.55);
  display:flex;align-items:flex-end}
.sheetBody{background:var(--paper);width:100%;border-radius:18px 18px 0 0;
  padding:18px 16px calc(18px + env(safe-area-inset-bottom));max-height:82%;overflow-y:auto}
.sheetBody h2{margin:0 0 4px;font-size:19px}
.sheetBody p{margin:0 0 14px;color:var(--muted);font-size:14px}
.boxBtn{display:block;width:100%;text-align:left;border:1px solid var(--line);
  border-radius:12px;padding:14px;margin-bottom:9px;background:var(--paper)}
.boxBtn.shot{background:var(--wash);color:var(--done)}
.boxBtn b{font-size:18px}
.boxBtn span{display:block;font-size:13px;color:var(--muted);margin-top:3px}

/* ── 相機 ───────────────────────── */
#cam{position:fixed;inset:0;z-index:80;background:#000;display:flex;flex-direction:column}
#cam video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.camTop{position:relative;z-index:2;padding:calc(env(safe-area-inset-top) + 12px) 16px 12px;
  background:linear-gradient(#000C,#0000);color:#fff}
.camTop .nm{color:#fff;font-size:24px}
.camTop .sub{font-size:15px;opacity:.9;margin-top:2px}
.camTop .it{font-size:13px;opacity:.8;margin-top:4px;word-break:break-all}
.camBot{position:relative;z-index:2;margin-top:auto;
  padding:16px 20px calc(20px + env(safe-area-inset-bottom));
  background:linear-gradient(#0000,#000C);
  display:flex;align-items:center;justify-content:space-between}
.shutter{width:84px;height:84px;border-radius:50%;background:#fff;border:6px solid #FFFFFF66}
.shutter:active{transform:scale(.93)}
.camBtn{color:#fff;font-size:16px;padding:12px 6px;min-width:64px}
#camThumb{width:52px;height:52px;border-radius:9px;object-fit:cover;border:2px solid #fff8}
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:3}

/* ── 通知列 ─────────────────────── */
.row{display:flex;gap:12px;align-items:center;border:1px solid var(--line);
  border-radius:12px;padding:10px;margin-bottom:10px}
.row.sent{background:var(--wash);border-color:var(--wash)}
.row.sent .nm{color:var(--done)}
.row img{width:64px;height:64px;object-fit:cover;border-radius:9px;flex:none;background:var(--wash)}
.rowMain{flex:1;min-width:0}
.rowMeta{font-size:13px;color:var(--muted);margin-top:2px}
.rowMeta.warn{color:var(--alert);font-weight:700}
.rowActs{display:flex;flex-direction:column;gap:6px}

#toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);
  background:var(--ink);color:#fff;padding:12px 18px;border-radius:11px;
  font-size:15px;font-weight:600;z-index:90;opacity:0;transition:opacity .18s;
  pointer-events:none;max-width:86%;text-align:center}
#toast.on{opacity:.96}
@media (prefers-reduced-motion:reduce){*{transition:none !important}}
</style>
</head>
<body>
<div id="app">

  <!-- 出貨 -->
  <section id="s-shoot" class="screen">
    <div class="topbar">
      <h1>出貨拍照</h1>
      <div class="stamp" id="stamp">尚未取得資料</div>
    </div>
    <div id="shootBody"></div>
  </section>

  <!-- 通知 -->
  <section id="s-notify" class="screen hide">
    <div class="topbar">
      <h1>發送通知</h1>
      <div class="stamp" id="stamp2"></div>
    </div>
    <div id="notifyBody"></div>
  </section>

  <!-- 設定 -->
  <section id="s-setup" class="screen hide">
    <div class="topbar"><h1>設定</h1></div>
    <div id="setupBody"></div>
  </section>

  <nav id="tabs">
    <button data-go="s-shoot" aria-current="true"><span class="g">📷</span>出貨</button>
    <button data-go="s-notify"><span class="g">💬</span>通知<span class="badge hide" id="badgeNotify">0</span></button>
    <button data-go="s-setup"><span class="g">⚙️</span>設定</button>
  </nav>
</div>

<div id="toast"></div>

<script src="app.js"></script>
</body>
</html>
